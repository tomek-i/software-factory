# Asks outside contributors to sign CLA.md before their pull request can be merged.
# Signatures are stored on the `cla-signatures` branch, so `main` stays protected.
# pull_request_target runs with this repo's token but never checks out the PR's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/tomek-i/software-factory/blob/main/CLA.md
          branch: cla-signatures
          allowlist: tomek-i,dependabot[bot],renovate[bot],github-actions[bot]
